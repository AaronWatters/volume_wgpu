name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  cpu-reference-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run CPU/reference tests
        run: pytest -q -m "not gpu"
      - name: Build package
        run: python -m build
      - name: Exercise installed package outside source tree
        run: |
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          python -c "import volume_wgpu; import importlib.resources as ir; print('installed package okay'); print(ir.files('volume_wgpu').joinpath('shaders', 'increment.wgsl').read_text())"

  gpu-vulkan-smoke:
    runs-on: ubuntu-latest
    env:
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run GPU smoke tests on software Vulkan backend
        run: pytest -q -m gpu
