[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volume-wgpu"
version = "0.1.0"
description = "Microscopy volume manipulation built on wgpu-py"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "wgpu>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"volume_wgpu.shaders" = ["*.wgsl"]

[tool.pytest.ini_options]
markers = [
    "gpu: requires a working wgpu adapter/device",
]
testpaths = ["tests"]
